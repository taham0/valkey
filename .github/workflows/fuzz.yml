name: Fuzz

# Runs the valkey-benchmark fuzzer (tests/unit/fuzz-soak.tcl) for a fixed time in
# every setup, fuzz mode and build. A job fails on a crash, an assertion, a
# sanitizer report, a malformed reply, a hang, or a server that stops answering
# PING, and then uploads the server logs, the fuzzer output, the seed, the command
# line and the build flags.
#
# To replay a failed job, take its seed from the job log ("Fuzz seed: N") or from
# fuzz-info.txt in its upload, and run the same cell with the same seed and
# duration. Here: Run workflow with the setup, mode, build, duration and seed
# inputs. Locally: build with the make flags in fuzz-info.txt, then
#
#   ./runtest --single unit/fuzz-soak --fuzz-soak --fuzz-setup <setup> \
#       --fuzz-mode <mode> --fuzz-duration <duration> --fuzz-seed N
#
# Each client sends the same commands again, but the order between clients, the
# server's own random choices and its timers can differ, so a failure that needs a
# precise timing may take several reruns.

on:
  # Test branches only. Not for merging.
  push:
    branches: ["test/**"]
  schedule:
    # Not at 00:00 UTC, when daily.yml starts its jobs.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds per job (empty: FUZZ_DURATION in fuzz.yml)"
        default: ""
      seed:
        description: "Seed to replay (empty: a new seed per job)"
        default: ""
      setup:
        description: "Server setup"
        type: choice
        options: [all, standalone, cluster]
        default: all
      mode:
        description: "Fuzz mode"
        type: choice
        options: [all, default, malformed-commands, config-commands]
        default: all
      build:
        description: "Build"
        type: choice
        options: [all, normal, asan, ubsan]
        default: all
      file_issues:
        description: "Open or comment on issues for failures (otherwise only upload the text)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Seconds each job fuzzes for. The time window is still under discussion on #5567.
  FUZZ_DURATION: 120

jobs:
  fuzz:
    name: fuzz (${{ matrix.setup }}, ${{ matrix.mode }}, ${{ matrix.build }})
    if: |
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.repository == 'valkey-io/valkey')
    runs-on: ubuntu-latest
    # The build, FUZZ_DURATION, and the hour runtest allows for clients that still
    # wait on a reply after the deadline.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        setup: ${{ fromJSON((!inputs.setup || inputs.setup == 'all') && '["standalone", "cluster"]' || format('["{0}"]', inputs.setup)) }}
        mode: ${{ fromJSON((!inputs.mode || inputs.mode == 'all') && '["default", "malformed-commands", "config-commands"]' || format('["{0}"]', inputs.mode)) }}
        build: ${{ fromJSON((!inputs.build || inputs.build == 'all') && '["normal", "asan", "ubsan"]' || format('["{0}"]', inputs.build)) }}
    env:
      SETUP: ${{ matrix.setup }}
      MODE: ${{ matrix.mode }}
      BUILD: ${{ matrix.build }}
      INPUT_DURATION: ${{ inputs.duration }}
      INPUT_SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install libbacktrace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ianlancetaylor/libbacktrace
          ref: b9e40069c0b47a722286b94eb5231f7f05c08713
          path: libbacktrace
      - run: cd libbacktrace && ./configure && make && sudo make install
      - name: make
        run: |
          # The build flags of the matching jobs in daily.yml.
          case "$BUILD" in
            normal) flags=(SERVER_CFLAGS=-Werror USE_LIBBACKTRACE=yes) ;;
            asan) flags=(OPT=-O3 SANITIZER=address SERVER_CFLAGS=-Werror USE_LIBBACKTRACE=yes) ;;
            ubsan) flags=(OPT=-O3 SANITIZER=undefined SERVER_CFLAGS=-Werror LUA_DEBUG=yes USE_LIBBACKTRACE=yes) ;;
            *) echo "::error::Unknown build: $BUILD"; exit 1 ;;
          esac
          {
            echo "cell: setup=$SETUP mode=$MODE build=$BUILD"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "make: make ${flags[*]}"
            echo "compiler: $(cc --version | head -n 1)"
          } > fuzz-info.txt
          make -j4 "${flags[@]}"
      - name: testprep
        run: |
          sudo apt-get update
          sudo apt-get install tcl8.6 tclx -y
      - name: fuzz
        run: |
          duration="${INPUT_DURATION:-$FUZZ_DURATION}"
          if [[ ! "$duration" =~ ^[0-9]+$ || ! "$INPUT_SEED" =~ ^[0-9]*$ ]]; then
            echo "::error::duration and seed must be numbers"
            exit 1
          fi
          args=(--single unit/fuzz-soak --fuzz-soak --fuzz-setup "$SETUP" --fuzz-mode "$MODE"
                --fuzz-duration "$duration" --clients 1 --verbose --dont-clean)
          if [ -n "$INPUT_SEED" ]; then
            args+=(--fuzz-seed "$INPUT_SEED")
          fi
          echo "duration: $duration" >> fuzz-info.txt
          echo "runtest: ./runtest ${args[*]}" >> fuzz-info.txt
          ./runtest "${args[@]}"
      - name: Find the seed
        if: failure() || cancelled()
        run: |
          seed=$(grep -ahom1 '^Fuzz seed: [0-9]*' tests/tmp/fuzz-soak.*/output.txt || true)
          echo "seed: ${seed#Fuzz seed: }" >> fuzz-info.txt
      # tests/tmp has each server's log (stdout, stderr) and the fuzzer's command
      # line and output (fuzz-soak.*/).
      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-logs-${{ matrix.setup }}-${{ matrix.mode }}-${{ matrix.build }}
          path: |
            fuzz-info.txt
            tests/tmp/
      # Test branches only: job logs need a sign-in to read, annotations don't.
      - name: Annotate the result
        if: always()
        run: |
          set +e
          out=$(ls tests/tmp/fuzz-soak.*/output.txt 2>/dev/null | head -n 1)
          msg="no fuzzer output"
          if [ -n "$out" ]; then
            msg="$(grep -a -m 1 '^Fuzz seed:' "$out"); $(grep -a '^Fuzz outcome:' "$out" | tail -n 1); $(grep -a 'Total commands sent' "$out" | tail -n 1); $(grep -a 'All client threads completed' "$out" | tail -n 1); TIMEOUT lines: $(grep -a -c 'TIMEOUT:' "$out")"
          fi
          crash=$(grep -l -a 'BUG REPORT START' tests/tmp/server*/stdout 2>/dev/null | wc -l)
          san=$(grep -l -a -E 'Sanitizer|runtime error' tests/tmp/server*/stderr 2>/dev/null | wc -l)
          echo "::notice title=fuzz $SETUP $MODE $BUILD::$msg; servers with a crash report: $crash; servers with a sanitizer report: $san"
          grep -a -h -m 3 -E '==> |ERROR: AddressSanitizer|runtime error|TIMEOUT:|MALFORMED|Command that caused' tests/tmp/server*/stdout tests/tmp/server*/stderr "${out:-/dev/null}" 2>/dev/null | head -n 8 | cut -c1-300 | tr -d '%' | while read -r l; do echo "::warning title=fuzz $SETUP $MODE $BUILD::$l"; done
          true

  # Opens an issue for each new crash, assertion or malformed reply in the failed
  # jobs' logs, or comments on the open issue with the same signature. See
  # .github/scripts/fuzz-report.js. It only posts with the file_issues input, or,
  # for the scheduled run, the FUZZ_FILE_ISSUES repository variable set to true.
  # Otherwise it uploads the text it would post (fuzz-issue-report).
  report:
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
      - name: Test the issue filing script
        run: node .github/scripts/fuzz-report.test.js
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: fuzz-logs-*
          path: fuzz-logs
      - name: File issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FUZZ_FILE_ISSUES: ${{ (github.event_name == 'workflow_dispatch' && inputs.file_issues) || (github.event_name == 'schedule' && vars.FUZZ_FILE_ISSUES == 'true') }}
          # Where each kind of finding goes: "issue", or "hold" to fail this job
          # without filing. Sanitizer reports can be security bugs, which
          # SECURITY.md asks not to report in public issues, so they are held.
          # TODO: send held findings to a private alert once there is one.
          FUZZ_ROUTE_CRASH: issue
          FUZZ_ROUTE_ASSERTION: issue
          FUZZ_ROUTE_MALFORMED: issue
          FUZZ_ROUTE_SANITIZER: hold
        with:
          script: |
            const report = require('./.github/scripts/fuzz-report.js');
            await report.run({github, context, core, inputDir: 'fuzz-logs', outputDir: 'fuzz-issue-report'});
      - name: Upload the issue text
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-issue-report
          path: fuzz-issue-report/
